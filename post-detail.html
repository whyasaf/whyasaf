    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const postId = params.get("id");

        if (!postId || !blogPosts[postId]) {
          window.location.href = "/blog";
          return;
        }

        const post = blogPosts[postId];
        let currentLang = "tr";

        const titleEl = document.getElementById("postTitle");
        const leadEl = document.getElementById("postLead");
        const contentEl = document.getElementById("postContent");
        const nextTitleEl = document.getElementById("postNextTitle");

        function renderPost(lang) {
          const data = post[lang];
          if (!data) return;

          document.getElementById("pageTitle").textContent =
            data.title + " | Journal — whyasaf";
          document
            .getElementById("pageMeta")
            .setAttribute("content", data.lead);

          titleEl.textContent = data.title;
          leadEl.textContent = data.lead;
          contentEl.innerHTML = data.content;

          if (post.nextPostId && post.nextPostTitle) {
            nextTitleEl.textContent = post.nextPostTitle[lang] || post.nextPostTitle.tr;
          }
        }

        function switchLang(lang) {
          if (lang === currentLang) return;
          currentLang = lang;

          const targets = [titleEl, leadEl, contentEl];
          targets.forEach((el) => (el.style.opacity = "0"));

          setTimeout(() => {
            renderPost(lang);
            targets.forEach((el) => (el.style.opacity = "1"));
          }, 300);

          document.querySelectorAll(".lang-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.lang === lang);
          });
        }


        document.getElementById("heroImage").src = post.image;
        document.getElementById("heroImage").alt = post.tr.title;
        document.getElementById("postCategory").textContent = post.category;

        const dateEl = document.getElementById("postDate");
        dateEl.textContent = post.date;
        dateEl.setAttribute("datetime", post.dateISO);

        document.getElementById("postAuthor").textContent = post.author;
        document.getElementById("postLocation").textContent = post.location;

        if (post.nextPostId && blogPosts[post.nextPostId]) {
          nextTitleEl.href = "/post-detail?id=" + post.nextPostId;
        } else {
          document.getElementById("postNextSystem").style.display = "none";
        }


        renderPost("tr");


        document.querySelectorAll(".lang-btn").forEach((btn) => {
          btn.addEventListener("click", () => switchLang(btn.dataset.lang));
        });
      })();
    </script>
